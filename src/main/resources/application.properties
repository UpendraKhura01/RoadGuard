spring.application.name=roadGuard-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/RoadGuard
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.username=postgres
spring.datasource.password=***REMOVED***
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

roadguard.upload-dir=uploads/reports

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Reverse Googling Api service
roadguard.geocoding.baseUrl= https://nominatim.openstreetmap.org

roadguard.ai.provider=gemini
roadguard.ai.fallbackEnabled=true

# Gemini AI Configuration
roadguard.ai.gemini.model-id=gemini-3.1-flash-lite-preview
roadguard.ai.gemini.api-key=***REMOVED***

