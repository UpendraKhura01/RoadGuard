server:
  servlet:
    context-path: /roadguard/v1

spring:
  application:
    name: ${APPLICATION_NAME}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

roadguard:
  upload-dir: uploads/reports
  jwt:
    secret: ${JWT}
  geocoding:
    baseUrl: ${GEOCODING_BASE_URL}
  google:
    geocoding:
      baseUrl: ${GOOGLE_GEOCODING_BASE_URL}
      apiKey: ${GOOGLE_GEOCODING_API_KEY}
  ai:
    provider: ${AI_PROVIDER}
    fallbackEnabled: true
    gemini:
      model-id: ${AI_MODEL_ID}
      api-key: ${AI_API_KEY}
  image:
    cloud_name: ${CLOUD_IMAGE_STORAGE_NAME}
    api_key: ${CLOUD_IMAGE_STORAGE_API_KEY}
    api_secret: ${CLOUD_IMAGE_STORAGE_API_SECRET}
  twilio:
    account_sid: ${TWILIO_ACCOUNT_SID}
    auth_token: ${TWILIO_AUTH_TOKEN}
    phone_number: "${TWILIO_PHONE_NUMBER}"

APP:
  DEEP-LINK: ${APP_DEEP_LINK}

AuthUrl: ${AUTHURL}